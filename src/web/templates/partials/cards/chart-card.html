<!-- chart-card.html -->
<section class="ds-card">
  <div class="ds-card-head"><h2 class="ds-card-title">{{title}}</h2></div>
  {{#hint}}<p class="ds-sub">{{hint}}</p>{{/hint}}
  <div class="ds-chart-block">{{{chart}}}</div>
  {{#legend}}<div class="ds-chart-legend">{{{legend}}}</div>{{/legend}}
</section>
