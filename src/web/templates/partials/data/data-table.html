<!-- data-table.html -->
<div class="ds-table-wrap">
  <table class="ds-table">
    {{#caption}}<caption>{{caption}}</caption>{{/caption}}
    <thead><tr>{{#columns}}<th{{#numeric}} class="is-num"{{/numeric}}>{{label}}</th>{{/columns}}</tr></thead>
    <tbody>
      {{#rows}}<tr>{{#cells}}<td{{#numeric}} class="is-num"{{/numeric}}>{{value}}</td>{{/cells}}</tr>{{/rows}}
      {{^rows}}<tr><td colspan="{{columnCount}}"><div class="ds-sub">{{emptyText}}</div></td></tr>{{/rows}}
    </tbody>
  </table>
</div>
