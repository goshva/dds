<!-- error-state.html -->
<div class="ds-state ds-state--error" data-ds-error>
  <div class="ds-state-icon">!</div>
  <div class="ds-state-title">{{title}}</div>
  {{#detail}}<div class="ds-sub">{{detail}}</div>{{/detail}}
  {{#code}}<div class="ds-badge ds-badge--conflict">{{code}}</div>{{/code}}
</div>
